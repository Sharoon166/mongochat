[project]
name = "mongochat"
version = "0.1.0"
description = "Ask natural-language questions about a MongoDB database and get accurate, cited answers."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sharoon Shaleem", email = "ssharoon166@gmail.com" },
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "motor>=3.6",
    "openai>=1.40",
    "mcp>=1.2,<2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
mongochat = "mongochat.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "mongomock-motor>=0.0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mongochat"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["mongochat/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["mongochat/static"]
plugins = []

[[tool.mypy.overrides]]
module = ["mcp.*", "mongomock.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
